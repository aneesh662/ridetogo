{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="mb-1">Book a Ride</h3><small class="text-muted">1. Select Pickup → 2. Select Drop → 3. Choose vehicle</small></div><button id="gpsBtn" class="btn btn-outline-primary">📍 Use my location</button></div><div class="row g-3"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body"><div class="btn-group w-100 mb-3"><button type="button" id="pickupMode" class="btn btn-primary">Select Pickup</button><button type="button" id="dropMode" class="btn btn-outline-primary">Select Drop</button></div><div id="map"></div><div class="row mt-3"><div class="col-md-6"><label class="form-label">Pickup</label><input id="pickupText" class="form-control" placeholder="Tap map to select pickup" readonly></div><div class="col-md-6"><label class="form-label">Drop</label><input id="dropText" class="form-control" placeholder="Tap map to select drop" readonly></div></div><div class="mt-3 d-flex gap-2 flex-wrap"><span class="badge text-bg-primary">Distance: <b id="distanceLabel">0 km</b></span><span class="badge text-bg-secondary">Duration: <b id="durationLabel">0 min</b></span><span class="badge text-bg-success">Fare: <b id="fareLabel">₹0</b></span></div></div></div></div><div class="col-lg-5"><div class="card shadow-sm"><div class="card-body"><h5>Ride Details</h5><form method="post" id="bookingForm"><input type="hidden" name="pickup" id="pickup"><input type="hidden" name="dropoff" id="dropoff"><input type="hidden" name="pickup_lat" id="pickup_lat"><input type="hidden" name="pickup_lng" id="pickup_lng"><input type="hidden" name="dropoff_lat" id="dropoff_lat"><input type="hidden" name="dropoff_lng" id="dropoff_lng"><input type="hidden" name="distance_km" id="distance_km"><input type="hidden" name="duration_min" id="duration_min"><label class="form-label">Vehicle</label><select class="form-select mb-3" name="vehicle_type" id="vehicle" required>{% for f in fares %}<option value="{{f.name}}">{{f.name}} — ₹{{f.per_km}}/km</option>{% endfor %}</select><label class="form-label">Payment</label><select class="form-select mb-3" name="payment_method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select><button class="btn btn-success btn-lg w-100" id="bookBtn" disabled>Confirm Booking</button></form><div class="small text-muted mt-3">You must select both points on the map before booking.</div></div></div></div></div>{% endblock %}{% block scripts %}<script>window.FARE_URL="{{url_for('fare_preview')}}";</script><script src="{{url_for('static',filename='js/booking.js')}}"></script>{% endblock %}
