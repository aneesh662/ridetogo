{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h3>{{'Create User Account' if mode=='signup' else 'Login'}}</h3><form method="post">{% if mode=='signup' %}<input class="form-control mb-3" name="name" placeholder="Full name" required><input class="form-control mb-3" name="phone" placeholder="Phone" required>{% endif %}<input class="form-control mb-3" type="email" name="email" placeholder="Email" required><input class="form-control mb-3" type="password" name="password" placeholder="Password" required><button class="btn btn-primary w-100">{{'Sign Up' if mode=='signup' else 'Login'}}</button></form></div></div></div></div>{% endblock %}
